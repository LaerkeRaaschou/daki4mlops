data:
  name: tiny_imagenet
  root: data/tiny-imagenet-200
  mapping_path: data/mapping_path.json
  batch_size: 64
  val_split: 0.1
  classes: 200
  train_img: 100000  # 500 per class
  test_img: 10000

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 0.01
trainer:
  epochs: 3
scheduler:
  use: true
  cfg:
    _target_: torch.optim.lr_scheduler.StepLR
    step_size: 30
    gamma: 0.1
loss:
  _target_: torch.nn.CrossEntropyLoss
  label_smoothing: 0.1
earlystopping:
  use: false
  patience: 5
  delta: 0.01
  verbose: true
amp:
  use: true
  cfg:
    _target_: torch.cuda.amp.GradScaler
seed: 42
device: cuda
compile: true
