services:
  monitoring-api:
    build:
      context: ..
      dockerfile: DockerFile
    image: daki4mlops:monitoring-local
    command: uvicorn monitoring_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  deployment-job:
    build:
      context: ..
      dockerfile: DockerFile
    image: daki4mlops:monitoring-local
    command:
      - sh
      - -c
      - >
        python inference.py --metrics-log-path /app/results/runtime_metrics.jsonl &&
        python drift_detection.py &&
        python publish_monitoring_metrics.py
        --monitoring-url http://monitoring-api:8000
        --runtime-metrics-path /app/results/runtime_metrics.jsonl
        --drift-summary-path results/drift/drift_summary.json &&
        python deploy_model.py
    depends_on:
      - monitoring-api

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - monitoring-api
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
